  # ── Job 6: Update Jira Epic via Sync Bridge ─────────────────────────────────
  jira-epic-update:
    name: "Update Jira Epic via Sync Bridge"
    needs: [aggregate-and-update]
    runs-on: ubuntu-latest
    if: always() && env.JIRA_EPIC != ''

    steps:
      - name: Update Jira epic with validation results
        uses: actions/github-script@v7
        env:
          JIRA_URL:   ${{ secrets.JIRA_URL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER:  ${{ secrets.JIRA_USER }}
        with:
          script: |
            const jiraUrl   = process.env.JIRA_URL;
            const epicKey   = '${{ env.JIRA_EPIC }}';
            const overall   = '${{ needs.aggregate-and-update.outputs.overall_result }}';
            const reportUrl = `${{ github.server_url }}/${{ github.repository }}/issues/${{ needs.aggregate-and-update.outputs.report_issue }}`;
            const auth      = Buffer.from(`${process.env.JIRA_USER}:${process.env.JIRA_TOKEN}`).toString('base64');
            const headers   = { 'Authorization': `Basic ${auth}`, 'Content-Type': 'application/json' };

            // Add comment to Jira epic
            const comment = {
              body: {
                type: 'doc', version: 1,
                content: [{
                  type: 'paragraph',
                  content: [{
                    type: 'text',
                    text: `z/OS 3.2 Post-IPL Validation: ${overall} — LPAR: ${{ env.LPAR }} — ${new Date().toISOString().split('T')[0]}. GitHub Report: ${reportUrl}`,
                  }]
                }]
              }
            };

            await fetch(`${jiraUrl}/rest/api/3/issue/${epicKey}/comment`, {
              method: 'POST', headers, body: JSON.stringify(comment),
            });

            // Transition epic to Done if all passed
            if (overall === 'PASS') {
              const transResp = await fetch(`${jiraUrl}/rest/api/3/issue/${epicKey}/transitions`, { headers });
              const trans     = await transResp.json();
              const doneTrans = trans.transitions?.find(t => t.name === 'Done' || t.name === 'Closed');
              if (doneTrans) {
                await fetch(`${jiraUrl}/rest/api/3/issue/${epicKey}/transitions`, {
                  method: 'POST', headers,
                  body: JSON.stringify({ transition: { id: doneTrans.id } }),
                });
                console.log(`✅ Jira epic ${epicKey} transitioned to Done`);
              }
            }

            // Update custom field "Migration Status"
            await fetch(`${jiraUrl}/rest/api/3/issue/${epicKey}`, {
              method: 'PUT', headers,
              body: JSON.stringify({
                fields: {
                  customfield_migration_status: overall === 'PASS' ? 'IPL Validated' : 'IPL Validation Failed',
                  customfield_github_report_url: reportUrl,
                }
              }),
            });

            console.log(`Jira epic ${epicKey} updated with validation result: ${overall}`);

  # ── Job 7: Slack Notification ───────────────────────────────────────────────
  notify-completion:
    name: "Notify Completion"
    needs: [aggregate-and-update, jira-epic-update]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send completion notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_MIGRATION }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ needs.aggregate-and-update.outputs.overall_result == 'PASS' && '✅' || '❌' }} z/OS 3.2 Post-IPL Validation — ${{ needs.aggregate-and-update.outputs.overall_result }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*LPAR:*\n`${{ env.LPAR }}`"},
                    {"type": "mrkdwn", "text": "*Environment:*\n`${{ env.ENV_TYPE }}`"},
                    {"type": "mrkdwn", "text": "*CAB Change:*\n`${{ env.CAB_CHANGE_ID || 'N/A' }}`"},
                    {"type": "mrkdwn", "text": "*Report Issue:*\n<${{ github.server_url }}/${{ github.repository }}/issues/${{ needs.aggregate-and-update.outputs.report_issue }}|View Report>"}
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {"type": "plain_text", "text": "View Validation Run"},
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }